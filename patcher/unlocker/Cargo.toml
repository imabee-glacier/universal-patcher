[package]
name = "patcher-unlocker"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
patcher_core = { package = "universal-patcher", path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_Memory", "Win32_System_Diagnostics_Debug"] }

