[package]
name = "universal-patcher"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "patcher_core"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "patcher"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aws-lc-rs = "1"
jiff = "0.2"
tempfile = "3"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
zstd = "0.13"
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
unicode-normalization = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
futures-util = "0.3"
tough = { version = "0.24", features = ["http"] }
url = "2"
cap-std = "3"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
