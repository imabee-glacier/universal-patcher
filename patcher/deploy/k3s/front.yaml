# Public front on its own /32 (site.yaml): Caddy terminates TLS 1.2/1.3 and HTTP/3 with a
# Let's Encrypt certificate, serves the website built into the image, and serves the release
# repository from a read-only volume. deploy/host/patcher-guard.nft lets only 80/tcp (ACME
# HTTP-01 and the redirect), 443/tcp and 443/udp reach this address.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: universal-patcher
spec:
  # One replica, Recreate: two would both claim the address and the certificate volume.
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: patcher-front}
  template:
    metadata:
      labels: {app: patcher-front}
      annotations:
        k8s.v1.cni.cncf.io/networks: '[{"name":"pub-patcher","default-route":["64.112.14.1"]}]'
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: caddy
          image: patcher-front
          envFrom:
            - configMapRef: {name: patcher-site}
          ports:
            - {name: http, containerPort: 80}
            - {name: https, containerPort: 443}
            - {name: h3, containerPort: 443, protocol: UDP}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # The image ships /usr/bin/caddy with cap_net_bind_service; the capability has to
            # be in the bounding set for that exec to work.
            capabilities: {drop: ["ALL"], add: ["NET_BIND_SERVICE"]}
          volumeMounts:
            - {name: data, mountPath: /srv/repository, subPath: repository, readOnly: true}
            - {name: caddy-data, mountPath: /data}
            - {name: caddy-config, mountPath: /config}
          # Readiness needs the certificate (the kubelet connects by address; Caddy answers
          # with default_sni). Liveness only needs the listener, so a slow first issuance
          # never restarts the Pod into Let's Encrypt's rate limits.
          readinessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: {port: https}
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "2", memory: 512Mi}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: patcher-data, readOnly: true}
        - name: caddy-data
          persistentVolumeClaim: {claimName: patcher-caddy}
        - name: caddy-config
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
