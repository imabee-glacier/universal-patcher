# Applied on appsynergy-server with `kubectl apply -k deploy/k3s` after tools/deploy-preflight.sh
# passes. Images are pinned by digest; CI publishes them (deploy/README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - storage.yaml
  - site.yaml
  - front.yaml
  - jobs.yaml
configMapGenerator:
  - name: backup-filters
    namespace: universal-patcher
    files:
      - immutable.filter=backup-immutable.filter
      - mutable.filter=backup-mutable.filter
images:
  - name: patcher-front
    newName: ghcr.io/imabee-glacier/patcher-front
    digest: sha256:61de286c323e076a0361c908d405058f89110cb53c79096bd923680b4a751631
  - name: patcher-cli
    newName: ghcr.io/imabee-glacier/patcher-cli
    digest: sha256:e8239499d4cdf7d80cbb634b12372aa6398ddfcce945b8b2989033bd6f78cdad
