# Applied on appsynergy-server with `kubectl apply -k deploy/k3s` after tools/deploy-preflight.sh
# passes. Images are pinned by digest; CI publishes them (deploy/README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - storage.yaml
  - site.yaml
  - front.yaml
  - jobs.yaml
configMapGenerator:
  - name: backup-filters
    namespace: universal-patcher
    files:
      - immutable.filter=backup-immutable.filter
      - mutable.filter=backup-mutable.filter
images:
  - name: patcher-front
    newName: docker.io/library/patcher-front
    digest: sha256:ad348a3af1ec713efa5e0937f5b1fbfd5962899b9fe9523337a432d91f8094f7
  - name: patcher-cli
    newName: ghcr.io/imabee-glacier/patcher-cli
    digest: sha256:521d6aa6a57baff1a19611361fb4190e235818620f240d046af7ae61e9c9f492
