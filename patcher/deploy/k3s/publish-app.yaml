# Publishes the patcher release waiting in staging/ on the data volume. Not part of the kustomization:
# run it on demand, once per release, after uploading staging (deploy/README.md, "Publishing"):
#   kubectl create -f publish-app.yaml
#   kubectl -n universal-patcher wait --for=condition=complete job -l app=publish-app --timeout=15m
#
# Staging layout, under /var/lib/appsynergy/volumes/patcher-data/_data/staging/app:
#   packages/                          output of `patcher package-app` for every platform
#   notes.txt                          release notes; paragraphs separated by blank lines
#   offer                              platforms offered as verified downloads, one per line
#   UniversalPatcherSetup-<v>.exe      optional Windows installer
apiVersion: batch/v1
kind: Job
metadata:
  generateName: publish-app-
  namespace: universal-patcher
  labels: {app: publish-app}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {app: publish-app}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Secret files are root-owned; fsGroup makes the keys readable (0440) by this uid only.
        # OnRootMismatch: the data volume root is already 65532, so nothing is re-owned.
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: publish
          image: ghcr.io/imabee-glacier/patcher-cli@sha256:e8239499d4cdf7d80cbb634b12372aa6398ddfcce945b8b2989033bd6f78cdad
          command: ["/bin/sh", "-ec"]
          args:
            - |
              s=/srv/data/staging/app
              set -- --root=/keys/app-root.json --key=/keys/app-online.pem \
                --repository=/srv/data/repository --origin="$PATCHER_ORIGIN" --notes="$s/notes.txt"
              while read -r platform; do
                [ -n "$platform" ] && set -- "$@" --offer="$platform"
              done < "$s/offer"
              for setup in "$s"/UniversalPatcherSetup-*.exe; do
                [ -e "$setup" ] && set -- "$@" --windows-setup="$setup"
              done
              exec patcher publish-app "$s/packages" "$@"
          envFrom:
            - configMapRef: {name: patcher-site}
          env:
            - {name: TMPDIR, value: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "2", memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /srv/data}
            - {name: keys, mountPath: /keys, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: patcher-data}
        - name: keys
          secret: {secretName: release-signing, defaultMode: 0440}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
