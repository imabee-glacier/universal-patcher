# The two values that identify this deployment. Both are placeholders until the domain is chosen
# and its address is reserved; tools/deploy-preflight.sh refuses to continue while they are.
#
# Address: a free /32 in 64.112.14.0/25, reserved first in the control plane
# (POST /platform/public-ips/{id}/reserve-infrastructure) and only then given a DNS record, so
# no customer can claim it and obtain a certificate for the name. The same address goes in
# deploy/host (the ingress guard and the br-pub route), installed with tools/install-host.sh.
#
# `.spec.config` is JSON: a comment inside it is a parse error and Multus then refuses every
# sandbox on the attachment. Half-defaults rather than 0.0.0.0/0 make the public path win over
# flannel's default route, so the front answers and egresses on its own address.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: pub-patcher
  namespace: universal-patcher
spec:
  config: |
    {
      "cniVersion": "1.0.0",
      "name": "pub-patcher",
      "type": "bridge",
      "bridge": "br-pub",
      "isGateway": false,
      "ipMasq": false,
      "hairpinMode": false,
      "ipam": {
        "type": "host-local",
        "ranges": [ [ { "subnet": "64.112.14.0/24",
                        "rangeStart": "64.112.14.67",
                        "rangeEnd": "64.112.14.67" } ] ],
        "routes": [ { "dst": "0.0.0.0/1", "gw": "64.112.14.1" },
                    { "dst": "128.0.0.0/1", "gw": "64.112.14.1" } ]
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: patcher-site
  namespace: universal-patcher
data:
  PATCHER_DOMAIN: play.imabee.com
  PATCHER_ORIGIN: https://play.imabee.com/
