# Local volumes on appsynergy-server, under /var/lib/appsynergy/volumes. Nothing chowns at
# startup and no Pod sets fsGroup: each directory is created owned by the uid that writes it
# (deploy/README.md, "First deployment").
#
# patcher-data (uid 65532), one filesystem for everything published:
#   repository/   served read-only at the site root by the front (subPath mount)
#     objects/ metadata/ targets/   game release repository
#     app/                          patcher release repository
#     site/data/                    website catalog and health status
#     install.sh, install.ps1
#   staging/      packages waiting to be published; never mounted by the front
# Staging and repository share one volume so publishing can move objects into place instead of
# copying them: a game release is tens of gigabytes. 300 GiB is an estimate for one game release,
# its intake, a superseded release kept for the retention window, and patcher releases; local
# volumes do not enforce it. Measure before relying on it.
#
# patcher-caddy (uid 1000): the front's Let's Encrypt account and certificate. It must persist:
#   an ephemeral volume re-issues on every restart, and Let's Encrypt allows five duplicates a week.
apiVersion: v1
kind: PersistentVolume
metadata: {name: patcher-data}
spec:
  capacity: {storage: 300Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local: {path: /var/lib/appsynergy/volumes/patcher-data/_data}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [appsynergy-server]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: patcher-data, namespace: universal-patcher}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: patcher-data
  resources: {requests: {storage: 300Gi}}
---
apiVersion: v1
kind: PersistentVolume
metadata: {name: patcher-caddy}
spec:
  capacity: {storage: 1Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local: {path: /var/lib/appsynergy/volumes/patcher-caddy/_data}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [appsynergy-server]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: patcher-caddy, namespace: universal-patcher}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: patcher-caddy
  resources: {requests: {storage: 1Gi}}
